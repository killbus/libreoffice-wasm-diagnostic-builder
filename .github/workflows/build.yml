name: Build LibreOffice WASM diagnostic

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: GitHub runner label; use a larger runner label if the standard runner runs out of disk or memory
        required: true
        default: ubuntu-24.04
        type: string
      build_jobs:
        description: Maximum parallel compile jobs; the build script also caps this by CPU and available memory
        required: true
        default: "4"
        type: string

permissions:
  contents: read

concurrency:
  group: libreoffice-wasm-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: LibreOffice WASM package-classic load-v2 build
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 355
    env:
      BUILD_JOBS: ${{ inputs.build_jobs }}
      CACHE_ROOT: ${{ github.workspace }}/.cache
      OUTPUT_DIR: ${{ github.workspace }}/output
      LOG_DIR: ${{ github.workspace }}/logs

    steps:
      - name: Check out diagnostic builder
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Record runner capacity
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          lscpu
          free -h
          df -h

      - name: Install LibreOffice build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bison build-essential ca-certificates ccache cmake curl \
            flex gawk gettext git gperf libtool m4 make nasm ninja-build patch \
            pkg-config python3 python3-dev python3-setuptools unzip wget xsltproc \
            xz-utils zip libarchive-dev libcups2-dev libcurl4-openssl-dev \
            libfontconfig1-dev libfreetype6-dev libglib2.0-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer1.0-dev libgtk-3-dev \
            libharfbuzz-dev libicu-dev libjpeg-dev libkrb5-dev liblcms2-dev \
            libldap2-dev libnss3-dev libpng-dev libpoppler-cpp-dev libssl-dev \
            libxml2-dev libxslt1-dev uuid-dev

      - name: Prepare cache directories
        shell: bash
        run: mkdir -p .cache/emsdk .cache/tarballs .cache/ccache .cache/emscripten-cache logs output

      - name: Restore Emscripten SDK
        id: restore-emsdk
        uses: actions/cache/restore@v5
        with:
          path: .cache/emsdk
          key: emsdk-${{ runner.os }}-3.1.74

      - name: Restore LibreOffice tarballs
        id: restore-tarballs
        uses: actions/cache/restore@v5
        with:
          path: .cache/tarballs
          key: lo-tarballs-d1c9e0e4-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lo-tarballs-d1c9e0e4-

      - name: Restore compiler cache
        id: restore-ccache
        uses: actions/cache/restore@v5
        with:
          path: .cache/ccache
          key: lo-ccache-${{ runner.os }}-d1c9e0e4-${{ hashFiles('autogen.input', 'patches/*.patch') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lo-ccache-${{ runner.os }}-d1c9e0e4-${{ hashFiles('autogen.input', 'patches/*.patch') }}-

      - name: Build diagnostic WASM
        id: build
        shell: bash
        run: |
          chmod +x scripts/build.sh
          scripts/build.sh

      - name: Save Emscripten SDK cache
        continue-on-error: true
        if: always() && steps.restore-emsdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/emsdk
          key: emsdk-${{ runner.os }}-3.1.74

      - name: Save LibreOffice tarball cache
        continue-on-error: true
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .cache/tarballs
          key: lo-tarballs-d1c9e0e4-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save compiler cache
        continue-on-error: true
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .cache/ccache
          key: lo-ccache-${{ runner.os }}-d1c9e0e4-${{ hashFiles('autogen.input', 'patches/*.patch') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload diagnostic build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: libreoffice-wasm-diagnostic-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Upload diagnostic WASM
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: libreoffice-wasm-diagnostic-d1c9e0e4-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0